repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
    - id: check-merge-conflict
    - id: debug-statements
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: local
    hooks:
    - id: ruff-check
      name: ruff check
      language: system
      types_or: [python, pyi]
      entry: uv run --locked ruff check --fix
    - id: ruff-format
      name: ruff format
      language: system
      types_or: [python, pyi]
      entry: uv run --locked ruff format
    - id: ty
      name: ty
      language: system
      types_or: [python, pyi]
      entry: uv run --locked ty check
      pass_filenames: false
