[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "safeway-coupons"
description = "Automatic coupon clipper for Safeway and Jewel-Osco loyalty offers"
license = "GPL-3.0-or-later"
authors = [ { name = "Stephen Kent", email = "smkent@smkent.net" } ]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14,<4.0"
dynamic = [ "version" ]
dependencies = [
    "dataclasses-json (>=0.6.7)",
    "requests (>=2.34.2)",
    "selenium (>=4.49.0)",
    "undetected-chromedriver (>=3.5.5)",
    "webdriver-manager (>=4.1.2)",
    "standard-distutils (>=3.11.9,<4.0.0)"
]

[project.scripts]
safeway-coupons = "safeway_coupons.app:main"
safeway-coupons-init-chromedriver = "safeway_coupons.chrome_driver:init"

[project.urls]
Repository = "https://github.com/johnmyrda/safeway-coupons"

[dependency-groups]
dev = [
    "cruft",
    "poethepoet",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-github-actions-annotate-failures",
    "pytest-sugar",
    "types-requests",
    "pytest-mock",
    "responses",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.uv]
required-version = ">=0.12.13"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["safeway_coupons"]

[tool.hatch.build.targets.sdist]
include = [
    "/safeway_coupons",
    "/tests",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
]

[tool.poe.tasks.lint]
cmd = "pre-commit run --all-files --show-diff-on-failure"
help = "Check all files"

[tool.poe.tasks.pytest]
cmd = "pytest"
help = "Run unit tests with pytest"

[tool.poe.tasks.test]
sequence = ["lint", "pytest"]
help = "Run all tests"

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
ignore = [
    "N818",  # Preserve existing public exception names.
    "S101",  # assert
    "S113",  # request_without_timeout
    "S311",  # suspicious_non_cryptographic_random_usage
    "S404",  # suspicious_subprocess_import
    "S603",  # subprocess_without_shell_equals_true
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]  # Test account passwords are fixtures.

[tool.coverage.run]
source = ["safeway_coupons"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.cruft]
skip = [".git"]

[tool.pytest.ini_options]
addopts = """\
    --cov \
    --cov-append \
    --cov-report term \
    --cov-report xml:.pytest_coverage.xml \
    --junitxml=.pytest_results.xml \
"""

