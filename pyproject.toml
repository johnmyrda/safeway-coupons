[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "safeway-coupons"
description = "Automatic coupon clipper for Safeway's online \"Safeway for U\" coupons"
license = "GPL-3.0-or-later"
authors = [ { name = "Stephen Kent", email = "smkent@smkent.net" } ]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14,<4.0"
dynamic = [ "version" ]
dependencies = [
    "dataclasses-json (>=0.6.7)",
    "requests (>=2.34.2)",
    "selenium (>=4.49.0)",
    "undetected-chromedriver (>=3.5.5)",
    "webdriver-manager (>=4.1.2)",
    "standard-distutils (>=3.11.9,<4.0.0)"
]

[project.scripts]
safeway-coupons = "safeway_coupons.app:main"
safeway-coupons-init-chromedriver = "safeway_coupons.chrome_driver:init"

[project.urls]
Repository = "https://github.com/smkent/safeway-coupons"

[dependency-groups]
dev = [
    "bandit[toml]",
    "black",
    "cruft",
    "flake8",
    "flake8-bugbear",
    "flake8-pyproject",
    "flake8-simplify",
    "isort",
    "mypy",
    "pep8-naming",
    "poethepoet",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-github-actions-annotate-failures",
    "pytest-sugar",
    "types-requests",
    "pytest-mock",
    "responses",
]

[tool.uv]
required-version = ">=0.12.13"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["safeway_coupons"]

[tool.hatch.build.targets.sdist]
include = [
    "/safeway_coupons",
    "/tests",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
]

[tool.poe.tasks.lint]
cmd = "pre-commit run --all-files --show-diff-on-failure"
help = "Check all files"

[tool.poe.tasks.pytest]
cmd = "pytest"
help = "Run unit tests with pytest"

[tool.poe.tasks.test]
sequence = ["lint", "pytest"]
help = "Run all tests"

[tool.bandit]
skips = [
    "B101",  # assert_used
    "B113",  # request_without_timeout
    "B311",  # blacklist_random
    "B404",  # blacklist_subprocess
    "B603",  # subprocess_without_shell_equals_true
]

[tool.black]
line-length = 79
target-version = ["py314"]

[tool.coverage.run]
source = ["safeway_coupons"]

[tool.coverage.report]
fail_under = 0
show_missing = true

[tool.cruft]
skip = [".git"]

[tool.flake8]
exclude = "./.*"

[tool.isort]
atomic = true
profile = "black"
line_length = 79

[tool.mypy]
files = [ "tests", "safeway_coupons" ]
mypy_path = "types"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = """\
    --cov \
    --cov-append \
    --cov-report term \
    --cov-report xml:.pytest_coverage.xml \
    --junitxml=.pytest_results.xml \
"""

